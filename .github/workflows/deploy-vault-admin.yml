name: Deploy Vault Admin

on:
  push:
    branches: [main]
    paths:
      - "vault-admin/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_FOR_QUARTZ }}
          ref: main
          fetch-depth: 0

      - name: Trigger Vercel deployment
        run: |
          TRIGGER_MS=$(date -u +%s)000
          echo "TRIGGER_MS=$TRIGGER_MS" >> $GITHUB_ENV
          curl -sS -f -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "Deploy triggered at $TRIGGER_MS"

      - name: Wait for production deployment to be ready
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Polling Vercel for new production deployment (up to 10 min)..."
          for i in $(seq 1 30); do
            sleep 20
            RESP=$(curl -s \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?limit=5&target=production")
            echo "API response: $RESP" | head -c 500
            URL=$(echo "$RESP" | jq -r --argjson since "$TRIGGER_MS" \
              '[.deployments[] | select(.createdAt > $since and .state == "READY")] | first | .url // empty')
            echo "Attempt $i/30 — URL found: '$URL'"
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              echo "url=https://$URL" >> $GITHUB_OUTPUT
              echo "Deployment ready: https://$URL"
              exit 0
            fi
          done
          echo "Timed out waiting for Vercel deployment"
          exit 1

      - name: Update VAULT_ADMIN_URL in landing page
        run: |
          NEW_URL="${{ steps.deployment.outputs.url }}"
          echo "Updating consts.ts to: $NEW_URL"
          cat .website/src/consts.ts
          sed -i "s|export const VAULT_ADMIN_URL = \"[^\"]*\"|export const VAULT_ADMIN_URL = \"$NEW_URL\"|" .website/src/consts.ts
          echo "--- After sed ---"
          cat .website/src/consts.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .website/src/consts.ts
          git status
          if git diff --staged --quiet; then
            echo "No URL change detected, skipping commit"
            exit 0
          fi
          git commit -m "chore: update vault admin URL to ${{ steps.deployment.outputs.url }}"
          git push origin main
